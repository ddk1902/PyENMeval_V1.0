[metadata]
name = species_prediction
version = 1.0
author = Diego G.
author_email = gomezdiego1902@gmail.com
description = Species niche models prediction
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ddk1902/PyENMeval_v1.1
license = MIT
keywords = GIS, ENMeval, MaxEnt, species_distribution

[options]
packages = find:
install_requires =
    numpy>=1.24
    pandas>=2.1
    geopandas>=1.13
    shapely>=2.1
    fiona>=1.9
    pyproj>=3.6
    rasterio>=1.4
    rasterstats>=0.19
    descartes>=1.1.0
    matplotlib>=3.8
    seaborn>=0.12
    pyenmeval>=0.2
    scikit-learn>=1.3
    tqdm>=4.66
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    run_balanceo = tests.test6_balanceo:main
    run_mapas = utils.generar_mapa_media:main
    run_modelado = tests.test4_modelado:main
